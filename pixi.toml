[workspace]
name = "bnt-nautilus"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<2"
scipy = ">=1.11,<2"
astropy = "*"
pyccl = "3.2.1.*"
camb = "*"
mpi4py = "*"
mpich = "*"
h5py = "*"
pip = "*"

[pypi-dependencies]
bnt-nautilus = { path = ".", editable = true }
fast-pt = "*"
torch = ">=2.15.0, <3"

[activation.env]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
